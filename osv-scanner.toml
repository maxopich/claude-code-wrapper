# Baseline ignore-list for OSV-Scanner. Matches the existing
# `npm audit --audit-level=high` policy in ci.yml — medium/low advisories
# are reported but don't block. Each entry has an `ignoreUntil` so this
# file forces a re-evaluation in 3 months if Dependabot hasn't already
# retired the entry by bumping the affected dep.
#
# When Dependabot opens a PR to bump one of these packages past its
# `FIXED VERSION`, REMOVE the entry rather than extending the date.
#
# OSV-Scanner fails the job on UNUSED ignores, so a stale entry breaks CI
# just as loudly as an unignored vuln — prune this file in the same PR
# that lands the fixing bump.
#
# Inventory refreshed 2026-07-28. The original PR #39 batch (T2.2,
# 2026-05-14: @anthropic-ai/sdk, hono, ip-address, brace-expansion 5.0.5,
# qs) was fully retired by upstream bumps and is removed here — all seven
# entries had gone unused, which is what was failing the scan. The
# lockfile bump in this same commit fixes body-parser 2.2.2 → 2.3.0,
# fast-uri 3.1.2 → 3.1.4 and postcss 8.5.16 → 8.5.21. The two entries
# below are what remains.

[[IgnoredVulns]]
id = "GHSA-mh99-v99m-4gvg"
ignoreUntil = "2026-08-07T00:00:00Z"
reason = "brace-expansion 5.0.7 (dev, transitive of eslint → minimatch). High (CVSS 7.5, unbounded expansion → OOM crash). Fix in 5.0.8, published 2026-07-23 — the repo's .npmrc min-release-age=7 refuses to resolve it until 2026-07-30, so this is a ~38h supply-chain cooldown hold, not an unfixed CVE. Short date on purpose: drop this entry in the same PR that bumps to 5.0.8. Dev-only; not present in any shipped artifact."

[[IgnoredVulns]]
id = "GHSA-frvp-7c67-39w9"
ignoreUntil = "2026-10-28T00:00:00Z"
reason = "@hono/node-server 1.19.14 (transitive of @modelcontextprotocol/sdk ← @anthropic-ai/claude-agent-sdk). Moderate (CVSS 5.9, serve-static path traversal on Windows via encoded backslash). The only npm-offered fix downgrades the agent SDK to 0.2.85 — a breaking change to the core runner — so we wait for the upstream bump instead. Cebab never mounts hono serve-static; the vulnerable code path is unreachable here."
