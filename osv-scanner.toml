# Shared advisory allowlist. Read by BOTH required security checks:
#
#   - the `OSV scan` workflow, natively (this is osv-scanner's own config)
#   - the `Audit dependencies` step in ci.yml, via `scripts/audit-gate.mjs`
#
# npm audit has no per-advisory ignore of its own, so the gate script wraps
# `npm audit --json` and applies these entries. That keeps one reviewable
# place to excuse an advisory instead of two mechanisms with different
# powers. Severity policy is unchanged: high/critical block, medium/low are
# reported but don't. Each entry has an `ignoreUntil` so this file forces a
# re-evaluation if Dependabot hasn't already retired the entry by bumping
# the affected dep — and the date is enforced, not decorative: once it
# lapses, the audit gate fails until the entry is fixed or re-dated.
#
# When Dependabot opens a PR to bump one of these packages past its
# `FIXED VERSION`, REMOVE the entry rather than extending the date.
#
# PRUNE THIS FILE IN THE SAME PR THAT LANDS THE FIXING BUMP. A dead entry is
# an excuse nobody re-reviews, and it is the one state neither gate reports
# loudly: OSV-Scanner prints `osv-scanner.toml has unused ignores:` and then
# exits 0, and `scripts/audit-gate.mjs` prints a `note:` line on an otherwise
# passing run.
#
# That last paragraph is a correction. This file asserted the opposite in
# four places — "OSV-Scanner fails the job on UNUSED ignores" — and the
# bump-and-delete-together rule was justified by it. Measured 2026-08-08
# against osv-scanner 2.4.0, with two genuinely unused entries and no
# unfiltered findings: "No issues found", exit 0. The two CI runs cited as
# proof (30242087493 and 30255443117, both 2026-07-27) each ALSO carried real
# unfiltered vulnerabilities — six and seven of them — so the exit 1 was
# those, and the unused-ignore notice merely shared the log. Upstream
# documents exit 0 = no findings, 1 = findings, and offers no flag for unused
# entries.
#
# Caveat, because the measurement is not quite the deployed thing: CI pins
# the action at v2.3.8 and the run above was the 2.4.0 CLI. The supportable
# claim is "undocumented, false at 2.4.0, and the runs cited as proof do not
# show it" — not "proven false at the pinned version". The rule itself is
# unchanged; only its justification moved, from a CI constraint to hygiene.
#
# Inventory refreshed 2026-08-02 (register C32). The original PR #39 batch
# (T2.2, 2026-05-14: @anthropic-ai/sdk, hono, ip-address, brace-expansion
# 5.0.5, qs) was fully retired by upstream bumps — all seven entries had
# gone unused, which is what was failing the scan.
#
# The brace-expansion hold (GHSA-mh99-v99m-4gvg, high) is retired here: it
# was a supply-chain cooldown wait, not an unfixed CVE, and 5.0.8 cleared
# `.npmrc`'s min-release-age on 2026-07-30. The lockfile bump 5.0.7 → 5.0.8
# lands in this same commit, exactly as the entry's own reason instructed.
# (The commit message gave "OSV-Scanner hard-fails on unused ignores" as the
# reason it HAD to be one commit; see the correction above — it is the right
# practice for a reason that turned out not to be that one.) 5.0.9 existed
# but was still inside the 7-day cooldown until 2026-08-06; 5.0.8 was the
# fixed version at the time.
#
# Inventory refreshed 2026-08-06. The GHSA-frvp-7c67-39w9 hold
# (@hono/node-server serve-static path traversal) is RETIRED here: the
# lockfile bump in this same commit moves @hono/node-server past it, so the
# entry went unused and had to go with it. (Same correction as above: the
# stated reason was OSV hard-failing, which it does not.)
#
# Three entries are added, all for the SAME reason and none an unfixed CVE:
# a patched version exists upstream but is still inside `.npmrc`'s
# `min-release-age=7` supply-chain cooldown, so npm refuses to resolve it
# ("No matching version found … with a date before …"). Overriding the
# cooldown to clear an audit warning would trade a real supply-chain control
# for a green check, which is the wrong direction. The dates below are set
# just past each package's eligibility so the entry expires almost
# immediately — the audit gate enforces `ignoreUntil`, so a forgotten excuse
# fails the build rather than lingering.
#
# NOTE ON SEVERITY, because the two consumers of this file disagree. The
# `Audit dependencies` gate blocks on high/critical only, and reports
# medium/low. OSV-Scanner's action exits 1 on ANY finding it does not filter,
# regardless of severity — so a MEDIUM advisory fails that required check
# while sailing through the audit gate. GHSA-8j4g-w8fx-2239 below is such a
# case; it needs an entry here even though the severity policy would not
# block on it. That is not a policy change, it is the price of one shared
# allowlist for two tools with different thresholds.
#
# Inventory refreshed 2026-08-08. One entry ADDED (nanoid), for the same
# cooldown reason as the three below and by the same rule the file already
# states: the patched version exists but `.npmrc`'s min-release-age=7 has not
# elapsed, and overriding that to clear an audit warning trades a real
# supply-chain control for a green check.
#
# ALSO NOW DUE, and deliberately NOT done here: brace-expansion 5.0.9 became
# eligible 2026-08-06T10:00Z and fast-uri 3.1.5 on 2026-08-07T09:16Z, so both
# of those entries are ready to be bumped-and-retired per their own reason
# text. That is dependency work, not this PR's subject; it is tracked
# separately so it lands as a reviewable lockfile change rather than riding
# along inside a formatting commit.
#
# Then, while CI was running, three MORE hono advisories landed
# (GHSA-54fx / GHSA-79qm / GHSA-f23p) — all fixed by the same 4.12.34 bump
# the existing hono entry is already waiting on. They are added at the
# bottom, and they are why this file is filtering seven IDs for what is
# really four packages: OSV-Scanner filters by advisory ID, not by package.
#
# Inventory refreshed 2026-08-08 (second pass). The two entries the previous
# note deferred are RETIRED here, with their lockfile bumps in this same
# commit: brace-expansion 5.0.8 → 5.0.9 (GHSA-rgw5-rvv9-x895) and fast-uri
# 3.1.4 → 3.1.5 (GHSA-7p8r-x3mc-p8w7). Both cooldowns had elapsed, so this is
# that deferred dependency work landing on its own, exactly as planned.
#
# hono 4.12.33 is deliberately NOT taken. It cleared the cooldown on
# 2026-08-07 and a blanket `npm install` reaches for it, but all four hono
# advisories below are fixed in 4.12.34 — so 4.12.33 retires nothing and only
# adds churn ahead of the real bump. `npm update <pkg> --package-lock-only`
# keeps a retirement PR to the packages it is actually retiring.
#
# Five entries remain, covering two packages, all expiring 2026-08-20. hono
# 4.12.34 becomes installable 2026-08-10T02:36Z and nanoid 3.3.17 at
# 2026-08-10T10:39Z, leaving ten days to land them.

