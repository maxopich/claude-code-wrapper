reason = "brace-expansion 5.0.8 (transitive). High — DoS via unbounded intermediate arrays. FIXED VERSION 5.0.9, published 2026-07-30T10:00Z, which clears .npmrc's min-release-age=7 cooldown at 2026-08-06T10:00Z. This is a cooldown wait, not an unfixed defect: bump to 5.0.9 and DELETE this entry in the same commit (OSV-Scanner fails on unused ignores). Exploitation needs attacker-controlled brace patterns; Cebab passes only its own literal globs."

