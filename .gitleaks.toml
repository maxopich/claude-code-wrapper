title = "Cebab gitleaks config"

# Inherits gitleaks' built-in ruleset (AWS keys, GitHub tokens, etc).
# Cebab-specific rules are appended below.
[extend]
useDefault = true

# Anthropic API key. Stable prefix `sk-ant-` covers api03, oat01, sid01,
# and any future shape — the prefix itself is reserved by Anthropic.
[[rules]]
id = "anthropic-api-key"
description = "Anthropic API key (sk-ant- prefix)"
regex = '''sk-ant-[A-Za-z0-9_-]{20,}'''
keywords = ["sk-ant-"]

# OAuth artifacts. `oauth_` is a soft prefix the user may paste into a
# session (refresh tokens, helper-script env exports). Lower confidence
# than sk-ant-, but cheap to catch.
[[rules]]
id = "oauth-prefixed-token"
description = "OAuth-prefixed token literal"
regex = '''oauth_[A-Za-z0-9_-]{20,}'''
keywords = ["oauth_"]

# Cebab WS auth token: ~/.cebab/auth-token holds a 64-hex digest
# (crypto.randomBytes(32).toString('hex')). Bare 64-hex is too noisy
# (every SHA-256 matches), so this rule requires an `auth_token` /
# `auth-token` keyword within 40 chars before the digest.
[[rules]]
id = "cebab-auth-token-context"
description = "auth_token keyword adjacent to 64-hex digest (Cebab WS token shape)"
regex = '''(?i)auth[_-]?token[^\n]{0,40}[0-9a-f]{64}'''
keywords = ["auth_token", "auth-token", "authtoken"]

# Every entry here must name a FILE, never a file class. Register C21: this
# list used to carry `.*\.test\.ts$`, which exempted 161 of the repo's 256
# test files — the single largest surface in the tree, and the one where
# credentials actually get pasted. (`.test.tsx` and `.test.mjs` were never
# matched, so React component tests were scanned the whole time; the gap was
# invisible because the scan looked like it was working.)
#
# Removing it cost five inline allowances. A full scan without the blanket
# exemption found exactly 5 hits across 3 files, every one an obviously
# synthetic literal, each now marked `gitleaks:allow` at its own line with a
# reason. Per-site allowances fail loudly when a NEW secret lands next to an
# old one; a path pattern silently covers whatever arrives later.
[allowlist]
description = "Cebab project allowlist"
# EMPTY, and the empty list is the point — `scripts/scopedChecks.test.mjs`
# reads this key and would report a RENAMED one as a silent hole, so the array
# stays even at zero entries.
#
# It held `fixtures/hello\.jsonl$`, justified as "one reviewed artifact, not a
# class of files" because other fixtures went through review via the path-label
# gate. That gate is gone, so the justification is too. Measured before
# removing: gitleaks 8.30.1 with this config finds nothing in `fixtures/` either
# way, and an injected `sk-ant-…` in `hello.jsonl` is HIDDEN with the entry and
# FOUND without it — so the exemption bought nothing and cost a blind spot on
# the one fixture a reader is most likely to copy from.
paths = [
]
# The five literals the removed `.*\.test\.ts$` exemption had been covering.
#
# Allowlisted by VALUE rather than with an inline `gitleaks:allow` marker,
# for two reasons. History is immutable: gitleaks scans commits, not just the
# worktree, so a marker added today does nothing for the same line as it
# exists in 338 prior commits, and the weekly full-repo scan would go red.
# And a literal is STRICTER than a marker — edit one of these strings and the
# regex stops matching, so the new value gets re-reviewed instead of
# inheriting an exemption that was granted to something else.
#
# Each is a redaction-test input: the point of the test is that the redactor
# eats it. Adding to this list means asserting a specific string is fake.
regexes = [
  # server/src/ws/session_log.security.test.ts + shared/src/redact.test.ts.
  # These match the SECRET, which for `curl-auth-header` is the token alone —
  # the `Bearer ` prefix is part of the Match, not the capture. The three
  # sibling entries below happen to be whole-secret literals, so the
  # distinction only bites here.
  '''abcd1234efgh5678ijkl''',
  # server/src/ws/session_log.test.ts — DEADBEEF stands in for the payload.
  '''sk-ant-api03-DEADBEEF-payload''',
  # shared/src/redact.test.ts — sequential digits, not a key.
  '''sk-1234567890abcdef1234567890abcdef1234''',
  # shared/src/redact.test.ts — truncated sample JWT, unsigned.
  '''eyJhbGciOiJI\.eyJzdWIiOiIxMjM0\.SflKxwRJSMeKKF0kIs''',
]
