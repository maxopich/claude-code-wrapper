name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# WHY THIS IS TWO JOBS AND NOT ONE, AND WHY THE BUDGETS DIFFER.
#
# It was one `quality` job with `timeout-minutes: 15` for every step. Measured
# 2026-08-30 across the 24 most recent runs, the windows-2022 leg took 546-797s
# against that 900s cap — 61-89% of budget, median 607.5s, and the worst
# PASSING run left 103s of headroom. Run 33312182698 then drew a slow runner and
# was killed at 902s with no assertion having failed: the annotation reads "The
# job has exceeded the maximum execution time of 15m0s" and the last line inside
# the step is a Windows `Terminate batch job (Y/N)?` prompt. The ubuntu leg
# passed the same SHA in 7m2s, and a plain re-run of the identical commit went
# green in 10m20s. So the red was the budget, not the diff — and it reached a PR
# that changed five files by two net lines.
#
# Raising the single cap would only move that cliff. The split targets where the
# time actually goes on Windows: setup ~120s, the static checks ~60s, `npm test`
# ~265s and `npm run test:security` ~171s — i.e. the two test steps are ~70% of
# the job. Separating them means the static checks report in ~3 minutes instead
# of queueing behind a 10-minute test run, and each job gets a budget sized to
# its own measured distribution rather than one cap sized to the sum.
#
# Budgets are set against MEASURED worst-case, not median: `checks` ~200s under
# 12 min, `tests` ~555s under 25 min. Both still catch a genuine hang, which is
# what a timeout is for; neither is close enough to its own median for ordinary
# runner variance to reach it.
#
# THE SETUP STEPS ARE DUPLICATED ON PURPOSE. They were a local composite action
# first, which is the obvious way to stop two jobs drifting apart — and
# `scripts/workflowPermissions.test.mjs` rejected it: rule 3 requires every
# `uses:` to be SHA-pinned, and GitHub has no syntax that pins a `./` local
# action, so the gate makes them unusable here. Weakening a supply-chain rule to
# tidy a workflow is the wrong trade, so the steps are inlined and the anti-drift
# property is asserted by `ci_setup_steps_match` in that same test file instead —
# which is a stronger guarantee than sharing the text, because it fails loudly
# rather than silently doing whatever the shared copy says.
#
# Re-measure with:
#   gh api repos/<owner>/<repo>/actions/jobs/<id> --jq '.steps[]|[.name,.started_at,.completed_at]|@tsv'
jobs:
  checks:
    name: Checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        # Pinned to windows-2022 (was windows-latest). ORIGINAL CAUSE, and it
        # names a runtime this workflow no longer uses: the newer
        # windows-latest image ships Visual Studio 18 (2026), which the node-gyp
        # bundled with NODE 20 could not parse (read it as version
        # "undefined"). better-sqlite3's `prebuild-install || node-gyp rebuild`
        # then died in the compile fallback at "Rebuild native modules", before
        # any test ran.
        #
        # CI has been on Node 24 since `Cebab-mfvu`, which ships a newer
        # node-gyp, so the pin's premise may already be gone — UNMEASURED
        # either way. It is left in place because the failure mode it prevents
        # costs a red required check on every PR, and because nothing here
        # needs windows-latest.
        #
        # REVERT CONDITION, stated so it is testable rather than a hope
        # ("once node-gyp/the image stabilise" was neither): open a PR that
        # changes this one value to `windows-latest` and read the "Rebuild
        # native modules" step. Green means the pin can go. That is the whole
        # experiment, it costs one CI run, and it is the only thing that
        # settles it. The `required` aggregate below keys off matrix results,
        # not per-OS names, so the rename needs no branch-protection change.
        os: [ubuntu-latest, windows-2022]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # Cebab-mfvu: kept in lockstep with the root package.json
        # `engines.node` floor, which `.npmrc`'s engine-strict=true enforces.
        # Node 20 was left behind because it reached end-of-life 2026-04-30 AND
        # two dependency majors this repo wants (jsdom 30, better-sqlite3 13)
        # exclude it in their own `engines` — npm installed them anyway, as a
        # warning, and the failure surfaced as runtime TypeErrors instead.
        # 24 over 22 (EOL 2027-04-30) and over 26 (dev's version; a small
        # CI/dev skew catches works-on-my-newest-Node). better-sqlite3 12.11.1
        # publishes NODE_MODULE_VERSION 137 prebuilds for linux-x64 and
        # win32-x64, so the rebuild step below does not fall through to
        # node-gyp on the pinned windows-2022 runner.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # `.npmrc` sets ignore-scripts=true; the explicit flag is belt-and-
        # braces. A malicious transitive postinstall must not execute on CI.
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        # better-sqlite3 is the only legitimate native dep. `.npmrc` sets
        # ignore-scripts=true which suppresses install lifecycle scripts
        # for `npm rebuild` too, so we opt back in explicitly here.
        # prebuild-install pulls a prebuilt binary on both Linux and
        # Windows x64 (no compiler toolchain needed) — this is also the
        # documented cross-platform `npm run setup` step.
        run: npm rebuild better-sqlite3 --foreground-scripts --ignore-scripts=false

      - name: Lockfile drift check
        # Catches the case where a contributor ran `npm install` locally
        # (mutating package-lock.json) instead of `npm ci`, and the diff
        # slipped into the PR unnoticed.
        run: git diff --exit-code package-lock.json

      - name: Lint
        run: npm run lint

      # Register C14: before this, formatting was enforced ONLY by the
      # lint-staged pre-commit hook — and `.npmrc` sets ignore-scripts=true,
      # which suppresses the `prepare` script that installs it. A contributor
      # who runs a plain `npm install` gets no hook, so unformatted code
      # reached main with every check green. It had: 66 tracked files were
      # unformatted when this step was added.
      - name: Format check
        run: npm run format:check

      - name: Typecheck
        run: npm run typecheck

      - name: Audit dependencies
        # Fails the job on high or critical advisories. Moderate/low are
        # reported but don't block — dependabot handles those on a weekly
        # cadence.
        #
        # Wraps `npm audit --json` rather than calling `npm audit
        # --audit-level=high` directly, because npm has no per-advisory
        # ignore: when one high advisory has no usable fix, the only
        # native responses are to drop a whole severity band or to
        # `continue-on-error` the entire gate. The wrapper reads the
        # allowlist from osv-scanner.toml — the same file the OSV scan
        # already honours — so an excused advisory is one dated, reasoned
        # entry that both required checks respect, and everything else
        # keeps blocking at full strength. An entry whose `ignoreUntil`
        # has lapsed fails the job.
        run: node scripts/audit-gate.mjs

      - name: DB migration smoke
        # Verifies migrations apply cleanly on a fresh DB. The runner is
        # ephemeral so the sqlite file is always brand new.
        run: npm run smoke

      - name: Build
        # Catches Vite-specific build failures and tsc --emit errors that
        # --noEmit doesn't surface (e.g. import resolution, asset pipeline).
        run: npm run build

      - name: WS protocol smoke (mock, cross-platform)
        # Pure-Node orchestrator (src/ci_smoke.ts): spawns the MOCK=1
        # server, polls /health over fetch, runs ws_smoke, tears it down.
        # Hermetic (isolated HOME/USERPROFILE) and shell-free, so it runs
        # identically on Linux and Windows — no `&` / `nc` / `timeout` /
        # `kill` (the old Linux-only bash pipeline is gone). Named by OS,
        # not by image: this is a portability claim, and it does not stop
        # being true when the matrix repins.
        run: npm --workspace server exec tsx src/ci_smoke.ts

  tests:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    # The slow half — see the header. ~555s measured on windows-2022 against a
    # 1500s cap. Deliberately generous: the failure this replaces was a correct
    # change parked because a runner ran ~1.4x slow.
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-2022]
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node.js
        # Cebab-mfvu: kept in lockstep with the root package.json
        # `engines.node` floor, which `.npmrc`'s engine-strict=true enforces.
        # Node 20 was left behind because it reached end-of-life 2026-04-30 AND
        # two dependency majors this repo wants (jsdom 30, better-sqlite3 13)
        # exclude it in their own `engines` — npm installed them anyway, as a
        # warning, and the failure surfaced as runtime TypeErrors instead.
        # 24 over 22 (EOL 2027-04-30) and over 26 (dev's version; a small
        # CI/dev skew catches works-on-my-newest-Node). better-sqlite3 12.11.1
        # publishes NODE_MODULE_VERSION 137 prebuilds for linux-x64 and
        # win32-x64, so the rebuild step below does not fall through to
        # node-gyp on the pinned windows-2022 runner.
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        # `.npmrc` sets ignore-scripts=true; the explicit flag is belt-and-
        # braces. A malicious transitive postinstall must not execute on CI.
        run: npm ci --ignore-scripts

      - name: Rebuild native modules
        # better-sqlite3 is the only legitimate native dep. `.npmrc` sets
        # ignore-scripts=true which suppresses install lifecycle scripts
        # for `npm rebuild` too, so we opt back in explicitly here.
        # prebuild-install pulls a prebuilt binary on both Linux and
        # Windows x64 (no compiler toolchain needed) — this is also the
        # documented cross-platform `npm run setup` step.
        run: npm rebuild better-sqlite3 --foreground-scripts --ignore-scripts=false

      - name: Test
        run: npm test

      - name: Security regression tests
        # All security cases are Vitest unit tests tagged [security]. The
        # old F6/R3 bats shell tests were deleted with the bus scripts in
        # the pure-SDK rewrite, so there is no longer a bats dependency —
        # this step runs identically on Linux and Windows.
        #
        # It re-runs the whole suite to execute a tagged SUBSET of it, which
        # is why it costs ~171s on Windows on top of `npm test`. Kept as its
        # own step deliberately: a named, separately-reportable security
        # signal is worth the duplicate compute, and collapsing it into
        # `npm test` would remove the only place that proves the [security]
        # tag still selects anything.
        run: npm run test:security

  # Stable required-status-check context. Branch protection on `main`
  # requires the bare context "Lint, Typecheck, Test", but the matrix
  # jobs above report one context per matrix VALUE ("Checks (ubuntu-latest)"
  # / "Tests (windows-2022)"), so the bare name is never produced and the
  # required check hangs forever in "Expected — waiting for status".
  # This 1-step aggregator emits exactly that context and is green iff
  # every leg of BOTH matrix jobs passed — so the gate keeps working even if
  # the matrix gains/renames OSes later, with no branch-protection edits.
  #
  # Register X12: the example above named the rolling image until 2026-08-15.
  # Context names are generated from the matrix VALUES, so pinning the matrix
  # silently falsified the one sentence that explains why this job exists —
  # and the "gains/renames OSes later" line is precisely the case that had
  # already happened. Keep the example in step with the matrix.
  #
  # BOTH jobs are named here and both are compared. `needs` alone does not
  # gate: with `if: always()` this job runs whatever its dependencies did, so
  # a job missing from the comparison below would be a job nothing enforces.
  required:
    name: Lint, Typecheck, Test
    needs: [checks, tests]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every matrix leg of every job to have passed
        # Both results reach the script through `env`, never through `${{ }}`
        # inside `run:`. `needs.*.result` is a GitHub-supplied enum and not
        # attacker-controllable, so this is not a live injection — but zizmor's
        # `template-injection` audit flags every interpolation into a shell
        # body, on the principle that the next one added here might not be from
        # a safe source. Reading them as shell variables makes the audit's
        # judgement structural instead of per-expression.
        env:
          CHECKS_RESULT: ${{ needs.checks.result }}
          TESTS_RESULT: ${{ needs.tests.result }}
        run: |
          failed=0
          if [ "$CHECKS_RESULT" != "success" ]; then
            echo "checks matrix did not succeed (result=$CHECKS_RESULT)"
            failed=1
          fi
          if [ "$TESTS_RESULT" != "success" ]; then
            echo "tests matrix did not succeed (result=$TESTS_RESULT)"
            failed=1
          fi
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo "All matrix legs passed."
