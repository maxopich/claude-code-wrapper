name: scorecard

# OpenSSF Scorecard — weekly external posture signal. Several checks
# will fail until T2.3 (signed commits) and branch protection are
# fully configured at the repo level — keep this check informational
# until the score stabilizes ≥7, then promote to required.
#
# Public scorecard at https://api.securityscorecards.dev/projects/github.com/maxopich/claude-code-wrapper
#
# Plan reference: cebab-ci-cd-async-conway.md T2.2.

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  branch_protection_rule:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # SARIF upload to the Security tab.
      id-token: write # OIDC token for publishing results to the public DB.
      contents: read # Read the tree being scored.
      actions: read # Read workflow run metadata for the CI-tests check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run scorecard
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish to the public scorecard DB so the badge / public
          # query interface stays current. Public repos only.
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: scorecard-results.sarif
