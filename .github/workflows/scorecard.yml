name: scorecard

# OpenSSF Scorecard — external posture signal, INFORMATIONAL by design.
#
# It is not one of the seven required contexts on `main` and is not proposed
# as one: several of its checks fail on repo-level settings (signed commits,
# branch-protection detail) rather than on anything a PR can fix, so making it
# required would block every PR on a setting no PR can change.
#
# The three things it flags that ARE code — token permissions, SHA-pinned
# actions, dangerous triggers — are already enforced by
# `scripts/workflowPermissions.test.mjs`, which runs inside the required
# `npm test`, and by zizmor's auditor persona in `workflow-lint.yml`. Scorecard
# annotates; those two gate.
#
# An earlier note here said "promote to required once the score stabilizes ≥7".
# That was never done, and the reasoning above is why it should not be.
#
# Public scorecard at https://api.securityscorecards.dev/projects/github.com/maxopich/claude-code-wrapper

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 7 * * 1'
  branch_protection_rule:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analysis:
    name: Scorecard analysis
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      security-events: write # SARIF upload to the Security tab.
      id-token: write # OIDC token for publishing results to the public DB.
      contents: read # Read the tree being scored.
      actions: read # Read workflow run metadata for the CI-tests check.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run scorecard
        uses: ossf/scorecard-action@2d1146689b8cda280b9bc96326124645441f03bc # v2.4.4
        with:
          results_file: scorecard-results.sarif
          results_format: sarif
          # Publish to the public scorecard DB so the badge / public
          # query interface stays current. Public repos only.
          publish_results: true

      - name: Upload SARIF
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: scorecard-results.sarif
