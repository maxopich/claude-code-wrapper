name: dependency-review

# PR-time fail on new deps with high/critical advisories. Faster
# feedback than the weekly OSV cron, and complements `npm audit
# --audit-level=high` in ci.yml (which only catches transitive issues
# at the npm level — dependency-review-action sees the resolved tree).
#
# Free for public repos; no GHAS subscription required.

on:
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  review:
    name: Dependency review
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read # Read the base and head trees to diff their manifests.
      # `pull-requests: write` is required by comment-summary-in-pr to drop a
      # results comment on the PR. It is the ONLY write grant left in the
      # workflow set now that dependabot-auto-merge is gone, and it is narrow:
      # the action reads PR metadata plus the base/head diff and writes one
      # comment. It cannot merge.
      pull-requests: write # Post the dependency-review summary comment.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
