name: pr-label

# Auto-applies `awaiting-fixture-review` to any PR touching fixtures/*.jsonl,
# then fails the `fixture-review-gate` status check while that label is
# present. A CODEOWNER must verify the recorded SDK turns contain no real
# OAuth artifacts / API keys (the default gitleaks rules don't see them in
# JSONL prose payloads), then remove the label to clear the gate.
#
# Safety note: `pull_request_target` is used so the labeler has write
# perms on PR labels even for fork PRs. The gate job runs no PR-head code
# — it only reads label state from the API, so the elevated context is
# not a footgun here.

on:
  # zizmor: ignore[dangerous-triggers]
  # `pull_request_target` is required so the labeler has write perms on
  # labels for fork PRs. No PR-head code is checked out in this workflow.
  pull_request_target:
    types: [opened, synchronize, reopened, labeled, unlabeled]

permissions: {}

concurrency:
  # Keyed on the PR number, NOT `github.ref`. On `pull_request_target`,
  # `github.ref` is the BASE ref — `refs/heads/main` for every PR — so the
  # group collapsed into a single repo-wide bucket and `cancel-in-progress`
  # made unrelated PRs cancel each other. Observed on 2026-07-28T19:31:16Z:
  # three runs, two different head branches, two cancelled.
  #
  # That matters more here than in the `pull_request` workflows (whose
  # `github.ref` is the per-PR `refs/pull/N/merge` and is already unique):
  # `Fixture review gate` is a required check, and a cancelled run leaves the
  # PR blocked with no automatic retry — it only regenerates on the next
  # push or label change.
  group: ${{ github.workflow }}-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  apply-labels:
    name: Apply path labels
    # Don't re-add the label when a CODEOWNER removes it on (un)labeled
    # events — only re-evaluate on opens / pushes / reopens.
    if: contains(fromJSON('["opened","synchronize","reopened"]'), github.event.action)
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/labeler@bf12e9b00b37c5c0ca2b87b79b2daf7891dbda13 # v7.0.0
        with:
          configuration-path: .github/labeler.yml
          sync-labels: false

  fixture-review-gate:
    name: Fixture review gate
    runs-on: ubuntu-latest
    timeout-minutes: 2
    # Re-fetch labels via API rather than reading the event payload —
    # avoids the race where apply-labels added the label in the same run
    # but the event-payload labels are stale.
    needs: [apply-labels]
    # `always()` stays on the JOB, deliberately. This is a REQUIRED check, so a
    # job that skips leaves the check never reporting and the PR blocked with
    # nothing to click. The labeller's result is enforced by the guard STEP
    # below instead, which fails loudly inside a job that still runs.
    if: always()
    permissions:
      pull-requests: read
    steps:
      # Register C08: the gate reads label state from the API only, so if the
      # labeller FAILED, `awaiting-fixture-review` was never applied, the API
      # shows no label, and the gate below printed "Gate clear." — a PR adding
      # fixtures/*.jsonl could merge with no CODEOWNER check for real OAuth
      # artifacts or API keys, which is the entire reason this gate exists.
      #
      # `skipped` is allowed on purpose: apply-labels is gated to
      # opened/synchronize/reopened, so it is skipped on the labeled/unlabeled
      # events — which is exactly the CODEOWNER-removes-the-label path this
      # gate is here to serve. Only a real failure (or a cancellation) blocks.
      - name: The path labeller must have run
        if: needs.apply-labels.result != 'success' && needs.apply-labels.result != 'skipped'
        env:
          LABELLER_RESULT: ${{ needs.apply-labels.result }}
        run: |
          echo "::error::Path labelling did not complete (result: $LABELLER_RESULT), so 'awaiting-fixture-review' may be missing from a PR that needs it. This gate cannot tell 'no fixtures touched' from 'the labeller never ran', so it fails closed. Re-run the workflow."
          exit 1

      - name: Block while awaiting-fixture-review label is present
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          labels=$(gh api "repos/$REPO/issues/$PR_NUMBER/labels" -q '.[].name')
          echo "Labels on PR #$PR_NUMBER:"
          echo "$labels"
          if echo "$labels" | grep -qx 'awaiting-fixture-review'; then
            echo "::error::This PR touches fixtures/*.jsonl. A CODEOWNER must verify the recorded turns contain no real OAuth artifacts or API keys, then remove the 'awaiting-fixture-review' label."
            exit 1
          fi
          echo "Gate clear."
