name: workflow-lint

# Lints GitHub Actions workflows themselves. Catches expression-injection in
# `run:` blocks, schema errors, dangerous pull_request_target patterns, weak
# permissions, and secret-injection sinks. No bus tool call in Cebab is gated
# on a human — auto-approve is bypass in effect — so a CI workflow that leaks
# the GITHUB_TOKEN or executes attacker-controlled input is a higher-severity
# surface than usual.

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  push:
    branches: [main]
    paths:
      - '.github/workflows/**'
      - '.github/actions/**'
  schedule:
    # A BACKSTOP NOW, NOT THE ONLY SIGNAL. The auditor persona used to run here
    # and nowhere else, on the grounds that its low-severity ruleset was "too
    # noisy as a required PR check" — a statement about the tree at the time,
    # which carried 14 findings. The tree now carries zero, so the reason has
    # expired and the persona runs on PRs below.
    #
    # That matters because a `schedule` run has no PR to redden and this
    # workflow is not a required check, so its failures reached nobody: the
    # auditor run failed on 2026-08-17, 2026-08-24 and 2026-08-31 and the red
    # was never seen. `Cebab-tbpb`.
    - cron: '0 5 * * 1'

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  actionlint:
    name: actionlint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        # The script is fetched by COMMIT SHA, not by tag: `v1.7.12` is
        # mutable and can be repointed at other content, which is what
        # OpenSSF Scorecard's PinnedDependenciesID flagged on this line. Every
        # `uses:` in this repo is already SHA-pinned; this was the one
        # network fetch that was not.
        #
        # Residual, stated rather than implied: this pins the installer
        # script, not the release binary the script then downloads for
        # 1.7.12. Bump both together.
        run: |
          bash <(curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/rhysd/actionlint/914e7df21a07ef503a81201c76d2b11c789d3fca/scripts/download-actionlint.bash) 1.7.12 # v1.7.12

      - name: Run actionlint
        run: ./actionlint -color

  zizmor:
    name: zizmor
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install zizmor
        run: pipx install zizmor==1.24.1

      # ONE STEP, ONE PERSONA, ON EVERY EVENT. Splitting by `github.event_name`
      # meant the strict ruleset ran only on a trigger nobody watches. Running
      # it on the PR puts the finding in front of the person making the change
      # — and because the autonomous loop parks on ANY completed red check, not
      # only on the required context, it blocks an unattended merge too.
      #
      # zizmor is pinned to an exact version above, so a new audit cannot
      # appear on its own and redden an unrelated PR; it arrives only with a
      # deliberate bump, in front of whoever makes it.
      - name: zizmor (auditor persona)
        run: zizmor --no-progress --persona auditor .github/workflows
