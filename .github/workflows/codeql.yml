name: CodeQL

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  schedule:
    - cron: '0 4 * * 1'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Deny by default at the top; every job grants only what it needs. Without
# this block the jobs inherit the repository's default token scope, which is
# what OpenSSF Scorecard's TokenPermissionsID flagged here (high). The
# `analyze` job below already declares its minimal set, so this changes
# nothing about what runs — it stops a job added later from inheriting more.
permissions: {}

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      actions: read # Read workflow run metadata for the analysis upload.
      contents: read # Read the tree being analysed.
      security-events: write # Upload the SARIF results to the Security tab.

    strategy:
      fail-fast: false
      matrix:
        language: ['javascript-typescript']

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Initialize CodeQL
        uses: github/codeql-action/init@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          languages: ${{ matrix.language }}
          build-mode: none
          queries: security-and-quality
          # Smoke scripts are dev-only CLIs that connect to our own localhost
          # WebSocket. CodeQL flags branches/logs on the WS payload as
          # user-controlled-bypass / log-injection — they're false positives
          # in this context (we control both ends, server is bound to 127.0.0.1
          # with Origin gating). Skip the smoke harnesses from analysis.
          #
          # The `js/missing-rate-limiting` query flags Express route handlers
          # that perform "expensive" ops (file reads, DB queries) without an
          # express-rate-limit-style middleware. For Cebab this is the wrong
          # threat model: the HTTP server binds to 127.0.0.1, every route is
          # gated on Origin+Host AND a per-launch random token written to
          # ~/.cebab/auth-token (mode 0600), and the only legitimate caller
          # is the operator themselves on the same machine. A "rate limit"
          # against the operator pulling their own data is theater. If the
          # day comes that Cebab gates a non-operator caller (multi-user,
          # remote, OAuth-3rd-party), drop this exclude and revisit.
          config: |
            paths-ignore:
              - 'server/src/*_smoke.ts'
            query-filters:
              - exclude:
                  id: js/missing-rate-limiting

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          category: '/language:${{ matrix.language }}'
