version: 2
updates:
  # npm-залежності
  - package-ecosystem: 'npm'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
      time: '06:00'
    # Supply-chain cooldown: don't propose a version until it's aged 7 days.
    # Applies to version updates only — security updates still come through
    # immediately. Mirrors `min-release-age` in .npmrc.
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      patch-updates:
        update-types: ['patch']
      dev-dependencies:
        dependency-type: 'development'
        update-types: ['minor', 'patch']
    ignore:
      # better-sqlite3 13.x ships NO PREBUILT BINARIES AT ALL. Measured against
      # the upstream releases API on 2026-09-02: every 12.x release carries
      # 100-145 assets (Node ABIs 127/137/141/147 across darwin, linux,
      # linuxmusl and win32), and v13.0.0, v13.0.1, v13.0.2 and v13.0.3 each
      # carry ZERO. Confirmed by installing 13.0.3 in a scratch clone, where
      # `prebuild-install` fell through to `node-gyp rebuild` and compiled
      # SQLite from source.
      #
      # That is not a slow install, it is a different prerequisite: Python and
      # a C++ toolchain, on every platform including both CI legs. `npm run
      # bootstrap` exists to make a fresh clone work without one, and the
      # README says so — so a 13.x bump would silently retract the property
      # this project is built around.
      #
      # 12.11.1 is ALSO the newest 12.x on npm (12.11.2 and 12.12.0 exist as
      # GitHub releases but were never published there), so there is nothing to
      # move to inside the safe line. Revisit when a 13.x release appears with
      # assets attached; the check is one API call:
      #   gh api repos/WiseLibs/better-sqlite3/releases --jq '.[] | [.tag_name, (.assets|length)] | @tsv'
      - dependency-name: 'better-sqlite3'
        update-types: ['version-update:semver-major']
    labels:
      - 'dependencies'

  - package-ecosystem: 'github-actions'
    directory: '/'
    schedule:
      interval: 'weekly'
      day: 'monday'
    cooldown:
      default-days: 7
    # Cebab-yc3: keep the codeql-action family in ONE pull request.
    #
    # Dependabot treats each sub-path as its own dependency, so a single
    # codeql-action release arrives as three PRs — `init` and `analyze` in
    # codeql.yml, `upload-sarif` in scorecard.yml. (Located by the `uses:` path,
    # not by line number: the three numbers that used to be here — 37, 66 and 52
    # — had all drifted, to 44, 73 and 59, and a citation nobody can trust is a
    # citation nobody checks.) CodeQL
    # requires init and analyze to run the SAME version, so each of those two
    # PRs is red on its own, in either order:
    #
    #     Loaded a configuration file for version '4.36.2',
    #     but running version '4.37.1'
    #
    # Measured on #251 and #253 (4.36.2 -> 4.37.1) — both failed `Analyze`
    # after a fresh run against a green main, with every other check passing.
    # Neither can be merged alone and merging both leaves main's CodeQL red
    # between the two merges. `upload-sarif` is in a different workflow and is
    # not version-coupled, but it belongs to the same release and grouping it
    # keeps the family on one version, which is the invariant that actually
    # matters. Pinned SHAs are what hide the coupling from a reviewer: three
    # unrelated-looking hashes, one version comment each.
    #
    # NOT VERIFIABLE IN CI. No gate reads this file, so a pattern that matches
    # nothing looks exactly like a pattern that works. The proof is the next
    # codeql-action release: ONE pull request titled for the group, not three.
    # If three arrive again, the pattern is wrong — not the premise.
    groups:
      codeql-action:
        patterns:
          - 'github/codeql-action*'
    labels:
      - 'dependencies'
      - 'github-actions'
