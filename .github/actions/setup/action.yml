name: Set up Node and dependencies
description: >
  Node 20, a cached `npm ci`, and the one legitimate native rebuild. Extracted
  so the `checks` and `tests` jobs in ci.yml cannot drift apart: they are two
  jobs only because of a wall-clock budget, and any difference in how they
  install dependencies would make a red on one of them mean something
  different from a red on the other. Checkout stays in the caller — a local
  composite action cannot run before the repository it lives in exists.

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      # `.npmrc` sets ignore-scripts=true; the explicit flag is belt-and-
      # braces. A malicious transitive postinstall must not execute on CI.
      run: npm ci --ignore-scripts
      shell: bash

    - name: Rebuild native modules
      # better-sqlite3 is the only legitimate native dep. `.npmrc` sets
      # ignore-scripts=true which suppresses install lifecycle scripts
      # for `npm rebuild` too, so we opt back in explicitly here.
      # prebuild-install pulls a prebuilt binary on both Linux and
      # Windows x64 (no compiler toolchain needed) — this is also the
      # documented cross-platform `npm run setup` step.
      run: npm rebuild better-sqlite3 --foreground-scripts --ignore-scripts=false
      shell: bash
